[project]
name = "rag-system-lw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.5.9",
    "langchain-core==1.8.0",
    "langchain-groq==1.2.0",
    "langchain-text-splitters==1.1.3",
    "numpy==1.26.4",
    "pymupdf==1.28.2",
    "python-dotenv==1.2.4",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.7.0",
    "torch==2.2.2",
    "transformers==4.57.6",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.uv.build-backend]
module-name = ["document_processing", "retrieval", "rag"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
